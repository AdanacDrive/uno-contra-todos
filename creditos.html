<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b1f78">
  <title>Créditos · UNO contra todos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    .creditos { max-width: 560px; margin: 0 auto; padding: 32px 22px 48px; }
    .creditos h1 { font-family: var(--display); font-weight: 400; font-size: 2.2rem; color: var(--amarillo); margin: 0 0 10px; }
    .creditos p { color: #e6dcfb; line-height: 1.5; }
    .creditos ul { list-style: none; padding: 0; margin: 20px 0 28px; display: grid; gap: 10px; }
    .creditos li { background: rgb(255 255 255 / .08); border-radius: 14px; padding: 12px 16px; line-height: 1.4; }
    .creditos li strong { display: block; font-size: 1.1rem; }
    .creditos a { color: var(--amarillo); text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main class="creditos">
    <h1>Créditos</h1>
    <p>La música que trae el juego es libre de derechos, de Pixabay. Gracias a sus autores.</p>
    <ul id="lista"></ul>
    <a class="enlace" href="./">Volver al juego</a>
  </main>
  <script type="module">
    const lista = document.getElementById('lista');
    try {
      const canciones = await (await fetch('musica/canciones.json')).json();
      for (const c of canciones) {
        const li = document.createElement('li');
        li.innerHTML = `<strong></strong><span></span><br><a target="_blank" rel="noopener"></a> · <a target="_blank" rel="noopener"></a>`;
        li.querySelector('strong').textContent = `"${c.titulo}"`;
        li.querySelector('span').textContent = c.artista;
        const [lic, fuente] = li.querySelectorAll('a');
        lic.textContent = `Licencia ${c.licencia}`; lic.href = c.licenciaUrl;
        fuente.textContent = 'Fuente'; fuente.href = c.fuente;
        lista.append(li);
      }
    } catch {
      lista.innerHTML = '<li>No se pudo cargar la lista. Música libre de derechos de Pixabay (Pixabay Content License).</li>';
    }
  </script>
</body>
</html>
